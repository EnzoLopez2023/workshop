services:
  workshop:
    build:
      context: .
      args:
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID}
        VITE_AZURE_AUTHORITY_TENANT_ID: ${VITE_AZURE_AUTHORITY_TENANT_ID}
        VITE_AZURE_HOME_TENANT_ID: ${VITE_AZURE_HOME_TENANT_ID}
        VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID:-}
        VITE_SHOPKEEP_URL: ${VITE_SHOPKEEP_URL:-}
    container_name: workshop
    ports:
      - "3006:3006"
    volumes:
      - workshop-data:/data
    env_file:
      - .env
    environment:
      PORT: 3006
      DB_PATH: /data/workshop.db
      UPLOADS_PATH: /data/uploads
      AZURE_HOME_TENANT_ID: ${AZURE_HOME_TENANT_ID}
      API_AUDIENCE: ${API_AUDIENCE}
      ALLOWED_OID: ${ALLOWED_OID}
    restart: unless-stopped

volumes:
  workshop-data:
