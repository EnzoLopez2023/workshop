name: Build & Deploy Workshop

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-workshop
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: C:\Source\Repo\Workshop

    steps:
      - name: Sync repo
        shell: powershell
        run: |
          git fetch --all --prune
          git reset --hard origin/main

      - name: Build image
        shell: powershell
        run: docker compose build

      - name: Restart container
        shell: powershell
        run: docker compose up -d

      - name: Wait for server
        shell: powershell
        run: Start-Sleep -Seconds 4

      - name: Health check
        shell: powershell
        run: |
          $r = Invoke-RestMethod -Uri 'http://localhost:3006/api/health' -TimeoutSec 10
          if ($r.status -ne 'ok') { throw "Health check failed: $($r | ConvertTo-Json)" }
          Write-Host "OK - db: $($r.db)"
