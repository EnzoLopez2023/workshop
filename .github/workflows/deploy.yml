name: Build & Deploy Workshop to Azure

# Builds the image in ACR (server-side, so no local Docker needed by the
# runner) and tells the Azure web app to pull the new image.
#
# Runs on the self-hosted Windows runner because that's where `az` is
# already authenticated against the Visual Studio Enterprise subscription.
# If you ever move to a GitHub-hosted runner, replace the implicit
# `az` session with `azure/login` + OIDC federated credentials.
#
# Deploys leave /home/data/ untouched — see AZURE_ARCHITECTURE.md for
# what survives a deploy vs what doesn't.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'azure-infra/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy-workshop
  cancel-in-progress: false

env:
  RG: rg-personal-apps-prod
  ACR: acrenzolopez01
  IMAGE: workshop:latest
  WEBAPP: app-workshop-prod-lwxhu7jxlrbtu
  VITE_AZURE_CLIENT_ID: 0f303f8f-207f-4b7f-84a5-b5d0abcf49d1
  VITE_AZURE_TENANT_ID: 52188f12-db6b-46c6-88ff-08c802f0ed3b

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
        working-directory: C:\Source\Repo\Workshop

    steps:
      - name: Sync repo
        run: |
          git fetch --all --prune
          git reset --hard origin/main

      - name: Confirm Azure session
        run: |
          $sub = (az account show --query id -o tsv)
          if (-not $sub) { throw "az is not logged in on this runner" }
          Write-Host "Subscription: $sub"

      - name: Build image in ACR
        # ACR builds server-side. The Vite build needs the MSAL identifiers
        # baked in (see MIGRATION_RCA.md issue #3) — pass as --build-arg.
        #
        # On Windows, `az acr build` crashes streaming Vite's "✓" char
        # (MIGRATION_RCA.md issue #4). The build itself succeeds server-side.
        # We wrap in cmd.exe with `& exit 0` and force PS to exit clean.
        # The next step's health check verifies the new image actually runs.
        run: |
          cmd /c "az acr build --registry $env:ACR --image $env:IMAGE --build-arg VITE_AZURE_CLIENT_ID=$env:VITE_AZURE_CLIENT_ID --build-arg VITE_AZURE_TENANT_ID=$env:VITE_AZURE_TENANT_ID . > nul 2>&1 & exit 0"
          Write-Host "az acr build returned. Image push verified by next step's health check."
          exit 0

      - name: Restart web app to pull new image
        run: |
          az webapp restart -g $env:RG -n $env:WEBAPP

      - name: Wait for app to come up
        # Container cold start (Docker pull + Node boot) takes 2–4 minutes
        # on B1. Poll /api/health for 5 min before giving up.
        run: |
          $url = "https://$env:WEBAPP.azurewebsites.net/api/health"
          $deadline = (Get-Date).AddSeconds(300)
          while ((Get-Date) -lt $deadline) {
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 8
              if ($r.StatusCode -eq 200) {
                Write-Host "Healthy: $($r.Content)"
                exit 0
              }
            } catch { Start-Sleep -Seconds 5 }
          }
          throw "Health check did not pass within 5 min — check Azure portal app logs"
