<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 180 180" role="img" aria-label="The Workshop">
  <!-- App Store / home-screen icon. The same mark as public/favicon.svg — one
       flap in a steel frame, cut across the middle, with the board's amber lamp
       burning under it — but full-bleed: no rounded corners, no border stroke
       and no alpha, because iOS applies its own superellipse mask. -->
  <defs>
    <linearGradient id="wk-steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39434A"/>
      <stop offset="0.45" stop-color="#1F262B"/>
      <stop offset="1" stop-color="#12171A"/>
    </linearGradient>
    <linearGradient id="wk-flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#394248"/>
      <stop offset="0.4999" stop-color="#2E363B"/>
      <stop offset="0.5" stop-color="#242B2F"/>
      <stop offset="1" stop-color="#1D2327"/>
    </linearGradient>
  </defs>

  <rect width="180" height="180" fill="url(#wk-steel)"/>

  <rect x="22" y="26" width="136" height="112" rx="3" fill="url(#wk-flap)"/>

  <path d="M46 56 L68 108 L90 70 L112 108 L134 56"
        fill="none" stroke="#F2F4F1" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the lower flap sits in its own shadow -->
  <rect x="22" y="82" width="136" height="56" fill="#000000" fill-opacity="0.16"/>

  <!-- the seam, drawn last so the glyph is genuinely cut in two -->
  <path d="M22 82 H158" stroke="#000000" stroke-opacity="0.78" stroke-width="3"/>
  <path d="M22 84.5 H158" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <rect x="22" y="146" width="136" height="9" rx="1.5" fill="#FFB400"/>
</svg>
